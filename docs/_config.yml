# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Chay's log
#email: your-email@example.com
description: >- # this means to ignore newlines until "baseurl:"
  A scratchpad of ideas and thoughts 
domain: "chebbal.github.io"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://chebbal.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: HebbalChaitanya
github_username:  chebbal
share: true
social:
  type: Person
  links:
    - "https://twitter.com/HebbalChaitanya"
    - "https://linkedin.com/in/chaitanya-hebbal-21985339"

# Build settings
# theme: minimal-mistakes-jekyll
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme

# Theme Settings
minimal_mistakes_skin: "default"
search: true

# Site Settings
locale: "en-US"

# Add author information
author:
  name: "Chaitanya B Hebbal"
  avatar: "/assets/images/profile.jpg"
  bio: "Senior Software Engineer specializing in robotics and AI"
  location: "Munich, Germany"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/chaitanya-hebbal-21985339/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/chebbal"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/HebbalChaitanya"

# Navigation Settings
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Navigation Tabs
masthead_title: "Home"
breadcrumbs: true
search: true

# Main navigation links
atom_feed:
  hide: true

navigation:
  main:
    - title: "About"
      url: /about/
    - title: "Posts"
      url: /posts/
    - title: "Categories"
      url: /categories/
    - title: "Tags"
      url: /tags/
