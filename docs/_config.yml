title: Chaitanya B. Hebbal
description: >-
  A personal research lab on robotics, AI systems, and compilers.
domain: "itschebbal.in"
baseurl: ""
url: "https://itschebbal.in"
twitter_username: HebbalChaitanya
github_username: chebbal
share: true
social:
  type: Person
  links:
    - "https://twitter.com/HebbalChaitanya"
    - "https://linkedin.com/in/chaitanya-hebbal-21985339"

# Build settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-seo-tag

# Theme settings
minimal_mistakes_skin: "default"
search: true
locale: "en-US"

# Author
author:
  name: "Chaitanya B. Hebbal"
  avatar: "/assets/images/avatar.png"
  bio: "Robotics · AI Systems · Compilers"
  location: "Germany"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/chebbal"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/chaitanya-hebbal-21985339/"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/HebbalChaitanya"

# Homepage header
header:
  title: "Chaitanya B. Hebbal"
  tagline: "Robotics · AI Systems · Compilers"

# Pagination
paginate: 5
paginate_path: /page:num/

# Include
include:
  - _pages

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      show_date: true
      classes: wide
      toc: false
      share: true
      related: false
      pagination: true
      comments: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide
  - scope:
      path: ""
      type: logs
    values:
      layout: single
      author_profile: false
      read_time: true
      share: false
      related: false

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Collections
collections:
  logs:
    output: true
    permalink: /logs/:path/
  projects:
    output: false
    permalink: /projects/:path/

# Feed
atom_feed:
  hide: false

# Reading time
words_per_minute: 200

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/chebbal"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/chaitanya-hebbal-21985339/"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:chaitanya.b.hebbal@gmail.com"
    - label: "RSS"
      icon: "fas fa-fw fa-rss"
      url: "/feed.xml"

logo: "/assets/images/avatar.png"